services:
  giphy:
    build: .
    container_name: giphy
    restart: unless-stopped
    # Ceiling, not a reservation. Sized generously: too low = OOM kill on deploy.
    mem_limit: 256m
    pids_limit: 128
    expose:
      - "80"
    networks:
      - caddy-net

networks:
  caddy-net:
    external: true
