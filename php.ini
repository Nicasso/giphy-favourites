; PHP configuration for this site.
;
; Kept byte-identical across the PHP sites on the Mac mini — cinema, cocktail,
; cooking, emergency, giphy, spreekwoorden, status, vanavond — so a fix lands
; the same way everywhere. Anything genuinely app-specific goes at the bottom,
; under its own heading, and nowhere else.
;
; Why this file exists at all: php:8.x-fpm-alpine ships NO php.ini. Not
; php.ini-production, not php.ini-development, not even an empty one. So until
; this file existed every stock default was live in production:
;
;   display_errors = 1     errors rendered into the response
;   log_errors     = 0     and written nowhere
;   expose_php     = 1     X-Powered-By: PHP/8.5.x on every response
;   date.timezone  = UTC   regardless of ENV TZ, which only sets the system clock
;
; That is not theoretical. In cinema a cold data/ directory produced two
; consecutive 30-second max_execution_time fatals, served as HTTP 200 with a
; full stack trace and absolute filesystem paths, with nothing written to any
; log — and the service worker then cached that error page as the API snapshot.
;
; Loaded from /usr/local/etc/php/conf.d/zz-app.ini. The zz- prefix is load
; bearing: conf.d is read in alphabetical order, so this wins over anything an
; earlier file set.

; --- Errors: to the log, never to the visitor --------------------------------
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_reporting        = E_ALL

; /proc/self/fd/2 is the worker's own stderr, which php-fpm inherits from the
; container's stderr. So errors land in `docker compose logs` for the web
; requests, and in the `>...log 2>&1` redirect for the cron scripts. Verified
; against a scratch build of this image: a trigger_error() shows up in
; `docker logs` and not in the response body.
error_log = /proc/self/fd/2

; --- Don't advertise the runtime --------------------------------------------
expose_php = Off

; --- Time -------------------------------------------------------------------
; ENV TZ in the Dockerfile only fixes the SYSTEM clock, which is what crond
; reads. PHP reads date.timezone and otherwise falls back to UTC — so without
; this line every rendered timestamp is shifted and any "today" bucket rolls
; over at 01:00 or 02:00 local instead of at midnight.
date.timezone = Europe/Amsterdam
