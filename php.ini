; Kept identical across the PHP sites on the mini. App-specific values go at the
; bottom under their own heading, nowhere else.
;
; php:8.x-fpm-alpine ships no php.ini at all, so without this the stock defaults
; are live: display_errors=1, log_errors=0, expose_php=1, date.timezone=UTC.
;
; Loaded as conf.d/zz-app.ini — zz- so it sorts last and wins.

display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_reporting        = E_ALL

; The worker's stderr, inherited from the container's: errors land in docker logs.
error_log = /proc/self/fd/2

expose_php = Off

; ENV TZ only sets the system clock (crond). PHP reads this and otherwise runs UTC.
date.timezone = Europe/Amsterdam
