services:

  php:
    container_name: "giphy-php"
    image: php:8.5-fpm-alpine
    volumes:
      - ./html:/var/www/html
      # Same PHP config as prod, plus a dev override that shows errors on screen.
      - ./php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - ./php-dev.ini:/usr/local/etc/php/conf.d/zzz-dev.ini:ro
      - gifs:/var/www/gifs

  nginx:
    container_name: "giphy-nginx"
    image: nginx:alpine
    depends_on:
      - php
    volumes:
      - ./html:/var/www/html
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf
      - gifs:/var/www/gifs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.nginx-backend.loadbalancer.server.port=80"
      - "traefik.http.routers.nginx-backend.rule=Host(`giphy.docker.localhost`)"

  traefik:
    container_name: "giphy-traefik"
    image: traefik:v3
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --entrypoints.web.address=:80
    ports:
      - '80:80'
    volumes:
      - /Users/nico/.docker/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=false"

volumes:
  # Dev: php-fpm runs as www-data (82); chown once with
  # `docker compose run --rm -u 0 php chown -R 82:82 /var/www/gifs`.
  gifs:
