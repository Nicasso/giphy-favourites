services:

  php:
    container_name: "giphy-php"
    image: php:8.2-fpm-alpine
    volumes:
      - ./html:/var/www/html
      # Same PHP configuration as production (see php.ini), so dev is not
      # quietly running a different runtime — plus dev-only overrides that put
      # errors back on screen. zzz- sorts after zz-, so the overrides win.
      - ./php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - ./php-dev.ini:/usr/local/etc/php/conf.d/zzz-dev.ini:ro

  nginx:
    container_name: "giphy-nginx"
    image: nginx:alpine
    depends_on:
      - php
    volumes:
      - ./html:/var/www/html
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.nginx-backend.loadbalancer.server.port=80"
      - "traefik.http.routers.nginx-backend.rule=Host(`giphy.docker.localhost`)"

  traefik:
    container_name: "giphy-traefik"
    image: traefik:v3
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --entrypoints.web.address=:80
    ports:
      - '80:80'
    volumes:
      - /Users/nico/.docker/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=false"
