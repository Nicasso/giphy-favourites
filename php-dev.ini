; Dev-only overrides, layered on top of php.ini.
;
; Kept identical across the PHP sites on the Mac mini, and mounted only by
; docker-compose.yml (the dev stack) — never copied into the prod image.
;
; The point of mounting php.ini in dev at all is parity: the dev containers run
; the stock php:8.x-fpm-alpine image directly, so before this they had a
; different PHP configuration than production, which is exactly the shape of
; bug that let cooking ship a broken slug (a test that passed in the wrong
; environment). Dev now gets the same timezone and the same expose_php as prod.
;
; The one thing dev should NOT inherit is silent errors — so this file, loaded
; after php.ini (zzz- sorts after zz-), puts them back on screen.

display_errors         = On
display_startup_errors = On
