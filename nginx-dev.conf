server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    # Local copies, written by fetch-giphys.php into the gifs volume. Content per
    # id never changes, hence immutable. Not there yet: 302 to Giphy, uncached,
    # so the local file takes over as soon as it lands.
    location ~ ^/gifs/(?<gif>(still/)?(?<gid>[A-Za-z0-9]+))\.gif$ {
        root /var/www;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @giphy_$2;
    }
    location @giphy_ {
        add_header Cache-Control "no-store" always;
        return 302 https://media.giphy.com/media/$gid/giphy.gif;
    }
    location @giphy_still/ {
        add_header Cache-Control "no-store" always;
        return 302 https://media.giphy.com/media/$gid/giphy_s.gif;
    }
    location /gifs/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
